apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: hello-substrate
  namespace: kagent
spec:
  type: Declarative
  platform: substrate
  description: A friendly greeter running as a substrate actor
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      You are a friendly greeter. When asked who you are, say you are hello-substrate, a Go ADK agent inside a gVisor actor. Keep answers to one or two sentences.
  substrate:
    workerPoolRef:
      name: kagent-default
---
